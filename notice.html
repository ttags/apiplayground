<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Premium Player...</title>
  
  <!-- Referrer Scrubbing Client-Side Meta Redirect -->
  <meta http-equiv="refresh" content="0; url=https://www.ckjsdnfjcn.com/w1f13771?key=URL">
  
  <style>
    body {
      background-color: #0c101d; /* Matches standard premium dark-mode streaming sites */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .loader-container {
      text-align: center;
      padding: 20px;
    }

    /* Clean geometric loading spinner */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #00e5ff; /* Cyan active color accent */
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 20px auto;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0 0 10px 0;
    }

    p {
      color: #8fa0dd;
      font-size: 0.9rem;
      margin: 0;
    }

    .fallback-link {
      color: #00e5ff;
      text-decoration: none;
      font-weight: bold;
    }

    .fallback-link:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <h1>Connecting to Secure Streaming Node...</h1>
    <p>Please wait a moment. If the player does not load, <a class="fallback-link" href="https://www.ckjsdnfjcn.com/w1f13771?key=URL">click here</a>.</p>
  </div>

  <!-- Hard Fail-safe Backup: If the browser ignores the Meta Tag, JS takes over instantly -->
  <script>
    setTimeout(function() {
      window.location.href = "https://www.ckjsdnfjcn.com/w1f13771?key=URL";
    }, 100);
  </script>

</body>
</html>
